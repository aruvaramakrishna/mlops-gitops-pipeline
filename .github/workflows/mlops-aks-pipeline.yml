name: MLOps Production Pipeline (DVC + MLflow + AKS + ArgoCD)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/*.dvc'
      - 'requirements.txt'
      - 'requirements-serve.txt'
      - 'Dockerfile'

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: mlops-main
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}          # repository variable, e.g. myregistry
  IMAGE_NAME: ml-model-service
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  # Job 1: quality control
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src tests
      - name: Unit tests
        run: pytest -q

  # Job 2: pull data, train, gate, and publish the model.pkl bundle
  train-and-evaluate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pull dataset with DVC (version pinned by data/*.dvc in this commit)
        run: dvc pull
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.DVC_AZURE_STORAGE_CONNECTION_STRING }}

      - name: Train (logs to MLflow, writes models/model.pkl + metadata.json)
        run: python src/train.py

      - name: Evaluate gate (ValueError fails the pipeline below 90%)
        run: python src/evaluate.py

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: model-bundle
          path: |
            models/model.pkl
            models/model.pkl.sha256
            models/metadata.json
            models/metrics.json
          if-no-files-found: error
          retention-days: 30

  # Job 3: bake the validated model.pkl into an image, scan, push, record lineage
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: train-and-evaluate
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write            # OIDC to Azure
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download validated model bundle into the build context
        uses: actions/download-artifact@v4
        with:
          name: model-bundle
          path: models

      - name: Verify model integrity
        working-directory: models
        run: sha256sum -c model.pkl.sha256

      - name: Read model metadata
        id: meta
        run: |
          echo "model_name=$(jq -r .model_name models/metadata.json)" >> "$GITHUB_OUTPUT"
          echo "model_version=$(jq -r .model_version models/metadata.json)" >> "$GITHUB_OUTPUT"
          echo "run_id=$(jq -r .mlflow_run_id models/metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Set image tag (short Git SHA)
        id: set-tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            MODEL_NAME=${{ steps.meta.outputs.model_name }}
            MODEL_VERSION=${{ steps.meta.outputs.model_version }}
            MLFLOW_RUN_ID=${{ steps.meta.outputs.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            MODEL_NAME=${{ steps.meta.outputs.model_name }}
            MODEL_VERSION=${{ steps.meta.outputs.model_version }}
            MLFLOW_RUN_ID=${{ steps.meta.outputs.run_id }}
          cache-from: type=gha
          provenance: true

      - name: Record image in MLflow Model Registry
        env:
          MODEL_NAME: ${{ steps.meta.outputs.model_name }}
          MODEL_VERSION: ${{ steps.meta.outputs.model_version }}
          IMAGE_REF: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          pip install -q mlflow==2.14.1
          python - <<'PY'
          import os
          from mlflow.tracking import MlflowClient
          MlflowClient().set_model_version_tag(
              os.environ["MODEL_NAME"], os.environ["MODEL_VERSION"],
              "image", os.environ["IMAGE_REF"])
          PY

  # Job 4: GitOps promotion; ArgoCD reconciles the commit below
  update-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment: production      # optionally add required reviewers as a release gate
    timeout-minutes: 10
    permissions:
      contents: write            # push the manifest change
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag
        working-directory: k8s
        run: |
          kustomize edit set image \
            "${ACR_NAME}.azurecr.io/${IMAGE_NAME}=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ needs.build-and-push-image.outputs.image_tag }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): promote ${{ needs.build-and-push-image.outputs.image_tag }} [skip ci]"
          git pull --rebase origin main
          git push origin main
