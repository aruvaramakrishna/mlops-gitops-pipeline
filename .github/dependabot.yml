name: Dependencies

on:
  schedule:
    # Check for updates weekly (Monday 9 AM UTC)
    - cron: '0 9 * * 1'
  
  push:
    paths:
      - 'requirements.txt'
      - 'requirements-serve.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Check for dependency updates
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
